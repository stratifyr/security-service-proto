syntax = "proto3";

package security;

option go_package = "github.com/stratifyr/security-service/internal/handlers/grpc";

service SecurityService {
  rpc GetMarketDays(GetMarketDaysRequest) returns (GetMarketDaysResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  rpc GetSecurities(GetSecuritiesRequest) returns (GetSecuritiesResponse);
  rpc GetHistoricalData(GetHistoricalDataRequest) returns (GetHistoricalDataResponse);
  rpc UpsertSecurity(UpsertSecurityRequest) returns (UpsertSecurityResponse);
  rpc UpsertSecurityStat(UpsertSecurityStatRequest) returns (UpsertSecurityStatResponse);
  rpc GetIndices(GetIndicesRequest) returns (GetIndicesResponse);
  rpc UpsertIndex(UpsertIndexRequest) returns (UpsertIndexResponse);
  rpc UpsertIndexStat(UpsertIndexStatRequest) returns (UpsertIndexStatResponse);
  rpc GetMarketDataJobs(GetMarketDataJobsRequest) returns (GetMarketDataJobsResponse);
  rpc UpdateMarketDataJob(UpdateMarketDataJobRequest) returns (UpdateMarketDataJobResponse);
}

message GetMarketDaysRequest {
  string start_date = 1;
  string end_date = 2;
}

message GetMarketDaysResponse {
  repeated string days = 1;
}

message GetMetricsRequest {}

message GetMetricsResponse {
  repeated Metric metrics = 1;
  int32 total = 2;
}

message GetSecuritiesRequest {}

message GetSecuritiesResponse {
  repeated Security securities = 1;
  int32 total = 2;
}

message GetHistoricalDataRequest {
  int32 security_id = 1;
}

message GetHistoricalDataResponse {
  repeated MarketData market_data = 1;
  int32 total = 2;
}

message UpsertSecurityRequest {
  string isin = 1;
  string symbol = 2;
  string industry = 3;
  string name = 4;
  string image = 5;
  double ltp = 6;
  int64 volume = 7;
  int64 free_float_shares = 8;
}

message UpsertSecurityResponse {
  Security security = 1;
}

message UpsertSecurityStatRequest {
  int32 securityId = 1;
  string date = 2;
  double open = 3;
  double close = 4;
  double high = 5;
  double low = 6;
  int32 volume = 7;
}

message UpsertSecurityStatResponse {
  SecurityStat securityStat = 1;
}

message GetIndicesRequest {
  string date = 1;
}

message GetIndicesResponse {
  repeated Index indices = 1;
  int32 total = 2;
}

message UpsertIndexRequest {
  string name = 1;
  double value = 2;
  repeated int32 securityIds = 3;
}

message UpsertIndexResponse {
  Index index = 1;
}

message UpsertIndexStatRequest {
  int32 indexId = 1;
  string date = 2;
  double open = 3;
  double close = 4;
  double high = 5;
  double low = 6;
}

message UpsertIndexStatResponse {
  IndexStat indexStat = 1;
}

message GetMarketDataJobsRequest {
  string status = 1;
}

message GetMarketDataJobsResponse {
  repeated MarketDataJob marketDataJobs = 1;
  int32 total = 2;
}

message UpdateMarketDataJobRequest {
  int32 id = 1;
  string status = 2;
  bytes logs = 3;
}

message UpdateMarketDataJobResponse {
  MarketDataJob marketDataJob = 1;
}

message Security {
  int32 id = 1;
  string isin = 2;
  string symbol = 3;
  string industry = 4;
  string name = 5;
  string image = 6;
  double ltp = 7;
  int64 volume = 8;
  int64 free_float_shares = 9;
  double previous_close = 10;
  string created_at = 11;
  string updated_at = 12;
  MarketData market_data = 13;
}

message MarketData {
  string date = 1;
  double open = 2;
  double close = 3;
  double high = 4;
  double low = 5;
  int32 volume = 6;
  repeated SecurityMetric metrics = 7;
}

message SecurityMetric {
  int32 id = 1;
  double value = 2;
  double normalized_value = 3;
}

message Metric {
  int32 id = 1;
  string name = 2;
  string type = 3;
  int32 period = 4;
  string indicator = 5;
}

message SecurityStat {
  int32 id = 1;
  int32 securityId = 2;
  string date = 3;
  double open = 4;
  double close = 5;
  double high = 6;
  double low = 7;
  int32 volume = 8;
  string created_at = 9;
  string updated_at = 10;
}

message Index {
  int32 id = 1;
  string name = 2;
  double value = 3;
  double previous_close = 4;
  string created_at = 5;
  string updated_at = 6;
  IndexMarketData market_data = 7;
  repeated IndexConstituent constituents = 8;
}

message IndexMarketData {
  string date = 1;
  double open = 2;
  double close = 3;
  double high = 4;
  double low = 5;
}

message IndexConstituent {
  int32 id = 1;
  int32 index_id = 2;
  int32 security_id = 3;
  string isin = 4;
  string symbol = 5;
  string industry = 6;
  string name = 7;
  string image = 8;
  double ltp = 9;
  int64 volume = 10;
  int64 free_float_shares = 11;
  double previous_close = 12;
}

message IndexStat {
  int32 id = 1;
  int32 indexId = 2;
  string date = 3;
  double open = 4;
  double close = 5;
  double high = 6;
  double low = 7;
  string created_at = 8;
  string updated_at = 9;
}

message MarketDataJob {
  int32 id = 1;
  string type = 2;
  string status = 3;
  bytes logs = 4;
  string created_at = 5;
  string updated_at = 6;
}